let index = 0;
let score = 0;

let visited = Array(questions.length).fill(false);
let answered = Array(questions.length).fill(null);

function showQ(){
 let q = questions[index];
 visited[index] = true;

 document.getElementById("progress").innerText = (index+1)+"/"+questions.length;
 document.getElementById("question").innerText = q.q;

 let html="";
 q.a.forEach((a,i)=>{
   html+=`<button onclick="check(${i})">${a}</button><br>`;
 });
 document.getElementById("answers").innerHTML=html;

 updateNav();
}

function check(i){
 let q=questions[index];
 let btns=document.querySelectorAll("#answers button");

 if(i===q.correct){
  btns[i].classList.add("correct");
  score++;
  answered[index] = "correct";
 }else{
  btns[i].classList.add("wrong");
  btns[q.correct].classList.add("correct");
  answered[index] = "wrong";
 }

 btns.forEach(b=>b.disabled=true);
 updateNav();
}

function nextQ(){
 index++;
 if(index<questions.length) showQ();
 else alert("Score: "+score+"/"+questions.length);
}

function nav(){
 let html="";
 questions.forEach((q,i)=>{
   html+=`<button id="nav-${i}" onclick="go(${i})">${i+1}</button>`;
 });
 document.getElementById("nav").innerHTML=html;
}

function updateNav(){
 for(let i=0;i<questions.length;i++){ 
   let btn = document.getElementById("nav-"+i);
   btn.classList.remove("nav-active","nav-correct","nav-wrong","nav-visited");

   if(visited[i]) btn.classList.add("nav-visited");
   if(answered[i]==="correct") btn.classList.add("nav-correct");
   if(answered[i]==="wrong") btn.classList.add("nav-wrong");
   if(i===index) btn.classList.add("nav-active"); // ең үстінен override
 }
}

function go(i){
 index=i;
 showQ();
}

nav();
showQ();
</script>
